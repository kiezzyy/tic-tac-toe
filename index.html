<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Tic Tac Toe</title>
  <meta name="description" content="A cool, readable Tic Tac Toe game ready to deploy on Vercel." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Animated background blobs -->
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">TIC <span>TAC</span> TOE</h1>
      <p class="subtitle">Neon Edition — built for Vercel</p>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div class="score-card score-x">
        <span class="score-label">Player X</span>
        <span class="score-value" id="scoreX">0</span>
      </div>
      <div class="score-card score-draw">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreDraw">0</span>
      </div>
      <div class="score-card score-o">
        <span class="score-label">Player O</span>
        <span class="score-value" id="scoreO">0</span>
      </div>
    </section>

    <!-- Game controls -->
    <section class="controls">
      <div class="mode-toggle">
        <button id="btn2P" class="pill active">👥 2 Players</button>
        <button id="btnAI" class="pill">🤖 vs Computer</button>
      </div>

      <div class="difficulty hidden" id="difficultyRow">
        <label>
          <input type="radio" name="difficulty" value="easy" checked /> Easy
        </label>
        <label>
          <input type="radio" name="difficulty" value="hard" /> Hard
        </label>
      </div>
    </section>

    <!-- Status message -->
    <div class="status" id="status">Player <strong>X</strong>'s turn</div>

    <!-- Game board -->
    <section class="board" id="board" aria-label="Tic Tac Toe board">
      <!-- 9 cells generated by JS, but we write them out for readability -->
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <!-- Action buttons -->
    <section class="actions">
      <button id="btnRestart" class="btn btn-primary">↻ New Round</button>
      <button id="btnResetScore" class="btn btn-ghost">Reset Scores</button>
    </section>

    <footer class="footer">
      <p>Made with ♥ — Deploy it on Vercel in 1 minute. See README.</p>
    </footer>
  </main>

  <!-- Win overlay -->
  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2 id="winnerText">X Wins! 🎉</h2>
      <p>Nice game. Play again?</p>
      <button id="btnPlayAgain" class="btn btn-primary">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
